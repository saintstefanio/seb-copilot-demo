[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-connector"
version = "0.1.0"
description = "Zero-dependency Jira Cloud connector for agents, with a framework-neutral tool wrapper."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []  # stdlib only

[project.scripts]
jira-connector = "jira_connector:main"

[tool.setuptools]
py-modules = ["jira_connector", "jira_tools"]
